<!-- Raleway is the UI font for every theme (#65). It is not a stock
     web font, so Storybook loads it from Google Fonts; without this
     the stories would silently fall along the token stack to system
     fonts and Chromatic would never screenshot the real typeface.
     Weights mirror the DS fontWeight scale (400/500/600/700). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<!-- Alegreya is the verse-text font under Quiet Dawn (#66). Loaded
     the same way as Raleway so Memorize stories screenshot the real
     verse typeface instead of falling along the stack to Georgia. -->
<link
  href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
  rel="stylesheet"
/>
