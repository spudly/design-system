<!-- Raleway is the UI font for every theme (#65). It is not a stock
     web font, so Storybook loads it from Google Fonts; without this
     the stories would silently fall along the token stack to system
     fonts and Chromatic would never screenshot the real typeface.
     Weights mirror the DS fontWeight scale (400/500/600/700). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
