name: ci

on:
  # Push runs only on main: a feature-branch push that also has an open PR
  # otherwise runs CI twice for the same commit (push + pull_request).
  # PR branches are covered by the pull_request trigger below.
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same PR/branch so fix-pushes don't burn
# minutes on already-obsolete work.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@spudly"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
