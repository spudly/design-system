name: ci

on:
  # Push runs only on main: a feature-branch push that also has an open PR
  # otherwise runs CI twice for the same commit (push + pull_request).
  # PR branches are covered by the pull_request trigger below.
  push:
    branches: [main]
  # The `edited` type matters beyond the defaults: ticking a checkbox
  # in a PR body fires an edit event, and merge-guard below must
  # re-run then so the gate reflects the body's current state.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Cancel superseded runs for the same PR/branch so fix-pushes don't burn
# minutes on already-obsolete work. Keyed by PR number (not branch name)
# so fork PRs that happen to share a branch name can't cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    # PRs that change src/** must include a changeset: the consuming apps
    # scope their testing for a version bump from the changelog that
    # changesets generates, so a src change without one can be missed
    # downstream. See "Writing changesets" in README.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the PR diff against its base can be computed.
          fetch-depth: 0
      - name: Require a changeset for src changes
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Exempt: the changesets/action "Version Packages" PR (it consumes
          # changesets rather than adding one) and Dependabot PRs.
          if [ "$HEAD_REF" = "changeset-release/main" ] || [ "$PR_TITLE" = "Version Packages" ] || [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Exempt PR (head branch '$HEAD_REF', author '$PR_AUTHOR') - skipping changeset check."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"
          if ! grep -q '^src/' <<< "$changed"; then
            echo "No src/** changes in this PR - no changeset required."
            exit 0
          fi
          if grep -E '^\.changeset/[^/]+\.md$' <<< "$changed" | grep -qv '^\.changeset/README\.md$'; then
            echo "src/** changed and a changeset is included."
            exit 0
          fi
          echo "::error::This PR changes src/** but includes no changeset - add one with \`npm run changeset\`, describing user-visible feature changes in testable terms."
          exit 1

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@spudly"
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --test test/*.test.mjs

  # The PR template's pre-merge checklist is only useful if something
  # enforces it: this job fails while the PR body still contains
  # unchecked task-list items. An item struck through with ~~ counts
  # as waived, per the template's own convention, and items inside
  # fenced code blocks or HTML comments don't count. Self-referential
  # items — ones whose truth depends on this workflow's own result —
  # are exempt (see the scan below). Dependabot is exempt — its bodies
  # quote upstream changelogs that can contain task lists the PR
  # author didn't write.
  merge-guard:
    name: merge-guard
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
      - name: Reject unchecked task-list items
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.env.PR_BODY_FILE, 'utf8');
          // Drop fenced code blocks (``` and ~~~): examples quoted in
          // the body are not live checklist items.
          const kept = [];
          let fence = null;
          for (const line of raw.split('\n')) {
            const marker = line.match(/^\s*(```|~~~)/);
            if (marker) {
              if (fence === null) {
                fence = marker[1];
              } else if (marker[1] === fence) {
                fence = null;
              }
              continue;
            }
            if (fence === null) {
              kept.push(line);
            }
          }
          // Drop HTML comments: the template's guidance lives there.
          const text = kept.join('\n').replace(/<!--[\s\S]*?-->/g, '');
          // Self-referential items are exempt: "CI is green for the
          // exact head commit" asserts the result of the very workflow
          // this job belongs to (ci-gate needs merge-guard), so the box
          // can only be honestly checked once the gate has already
          // passed, and the gate could never pass while the box was
          // enforced — every intermediate head failed on it. Keep the
          // pattern in sync with .github/pull_request_template.md;
          // every other checklist item stays enforced.
          const selfReferential = [/^ci is green for the exact head commit\b/i];
          const itemText = (line) => line.replace(/^[-*+]\s+\[\s\]\s+/, '');
          const candidates = text
            .split('\n')
            .map((line) => line.trim())
            .filter(
              (line) => /^\s*[-*+]\s+\[\s\]\s+\S/.test(line) && !line.includes('~~'),
            );
          const exempt = candidates.filter((line) =>
            selfReferential.some((pattern) => pattern.test(itemText(line))),
          );
          for (const line of exempt) {
            console.log(`Exempt (self-referential): ${line}`);
          }
          const unchecked = candidates.filter((line) => !exempt.includes(line));
          if (unchecked.length > 0) {
            console.error('Unchecked task-list items in the PR body:');
            for (const line of unchecked) {
              console.error(`  ${line}`);
            }
            console.error(
              'Check each item off, or strike it through with a one-line reason, before merging.',
            );
            process.exit(1);
          }
          console.log('All task-list items in the PR body are checked or waived.');
          NODE

  # Always-reporting gate for branch protection: needs every job in
  # this workflow and reports whenever the workflow runs. It fails
  # only when a needed job failed or was cancelled, and passes when
  # the rest succeeded or were legitimately skipped. Note: this does
  # not make the gate appear on Version Packages PRs — those are
  # created by the changesets action with the default GITHUB_TOKEN,
  # and GitHub does not start workflow runs for token-created PRs at
  # all (see the PR description).
  ci-gate:
    name: ci-gate
    needs: [ci, merge-guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
