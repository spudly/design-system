name: ci

on:
  # Push runs only on main: a feature-branch push that also has an open PR
  # otherwise runs CI twice for the same commit (push + pull_request).
  # PR branches are covered by the pull_request trigger below.
  push:
    branches: [main]
  # No `edited` type here: ticking a checkbox in a PR body fires an
  # edit event, but the merge-guard job that had to re-run then moved
  # to its own workflow (merge-guard.yml, 2026-11-04), so a body edit
  # no longer re-runs the whole build.
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs for the same PR/branch so fix-pushes don't burn
# minutes on already-obsolete work. Keyed by PR number (not branch name)
# so fork PRs that happen to share a branch name can't cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    # PRs that change src/** must include a changeset: the consuming apps
    # scope their testing for a version bump from the changelog that
    # changesets generates, so a src change without one can be missed
    # downstream. See "Writing changesets" in README.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the PR diff against its base can be computed.
          fetch-depth: 0
      - name: Require a changeset for src changes
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Exempt: the changesets/action "Version Packages" PR (it consumes
          # changesets rather than adding one) and Dependabot PRs.
          if [ "$HEAD_REF" = "changeset-release/main" ] || [ "$PR_TITLE" = "Version Packages" ] || [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Exempt PR (head branch '$HEAD_REF', author '$PR_AUTHOR') - skipping changeset check."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"
          if ! grep -q '^src/' <<< "$changed"; then
            echo "No src/** changes in this PR - no changeset required."
            exit 0
          fi
          if grep -E '^\.changeset/[^/]+\.md$' <<< "$changed" | grep -qv '^\.changeset/README\.md$'; then
            echo "src/** changed and a changeset is included."
            exit 0
          fi
          echo "::error::This PR changes src/** but includes no changeset - add one with \`npm run changeset\`, describing user-visible feature changes in testable terms."
          exit 1

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@spudly"
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          # Release-only VR (Stephen's directive, 2026-11-02): the
          # VR baseline-completeness gate in
          # test/visualRegressionScope.test.ts is enforced only
          # where baselines are generated — the changesets release
          # PR. Ordinary PRs may add stories without committed
          # baselines; the release PR's VR run generates them.
          DSVR_ENFORCE_BASELINE_GATE: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'changeset-release/') }}

  # Always-reporting gate for branch protection: needs every job in
  # this workflow and reports whenever the workflow runs. It fails
  # only when a needed job failed or was cancelled, and passes when
  # the rest succeeded or were legitimately skipped. Note: this does
  # not make the gate appear on Version Packages PRs — those are
  # created by the changesets action with the default GITHUB_TOKEN,
  # and GitHub does not start workflow runs for token-created PRs at
  # all (see the PR description).
  ci-gate:
    name: ci-gate
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
