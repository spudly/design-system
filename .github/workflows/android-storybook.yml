# Visual regression for the react-native storybook on Android
# (issue #43). The react-native storybook is one of the repo's two
# storybooks (#122); this workflow is its CI.
#
# Separate from Chromatic (which gates the react/web Storybook): this
# job renders the same CSF stories in the Expo host app
# (apps/storybook) on an Android emulator and pixel-compares
# screenshots against baselines committed beside their story
# files (src/**/__snapshots__/, issue #530). See
# docs/android-visual-regression.md for the full workflow, including
# how baselines are generated and updated.
#
# Release-only PR gating (Stephen's directive, 2026-11-02): the
# expensive jobs (visual-regression and the baseline-commit jobs)
# run on pull requests ONLY when the head branch is a changesets
# release branch (changeset-release/*, i.e. the Version Packages
# PR). Ordinary PRs no longer run those jobs — native rendering
# changes surface, and baselines update, on the release PR
# instead. One exception: the sanity job (below) is NOT part of
# this gating — it still runs on any PR carrying the
# `android-sanity` label, as an explicit opt-in, and on
# workflow_dispatch runs with mode=sanity. Adding that label
# starts a run of its own (the trigger includes the `labeled`
# activity type — Stephen's directive, 2026-11-03): on a
# label-triggered run ONLY the sanity job runs (the heavy jobs
# stay gated off, even on a release PR), and a `labeled` event
# for any other label starts a run in which every job skips, so
# label churn costs nothing. The pull_request
# trigger therefore carries no paths filter: a release PR's
# diff is manifests and changelogs only,
# which the old path filter (src/**, apps/storybook/**,
# tools/visualRegression/**) would have excluded, so gating lives
# in the jobs' `if:` conditions. The push-to-main trigger is gone
# too: it existed to run a full compare on main, which warmed the
# Gradle cache from the default branch — with the heavy jobs
# release-only, that run no longer happens and release-PR runs
# save their own cache. workflow_dispatch stays available as the
# manual path (compare/update/sanity on demand). One interaction
# to expect on the release PR: while a release is pending, the
# changesets action recreates the release branch whenever main
# advances, force-updating it and dropping any VR baseline commits
# the commit-pr-baselines job pushed there. The synchronize event
# re-runs this workflow, which regenerates and re-commits the
# baselines — so the baseline commit is recreated after merges to
# main, and the diff to review is the one on the final head.
# Within a run, PR compare runs
# capture only the stories the PR's changes can affect (issue #114:
# the "Compute VR capture scope" step and
# tools/visualRegression/scope.mjs; anything shared or unmappable
# falls back to the full set), and the emulator boots from a
# cached AVD (issue #114) instead of paying AVD creation +
# first-boot setup every run.
#
# PR runs auto-commit regenerated baselines (Stephen's directive,
# 2026-10-23): when the compare finds screenshot diffs, the capture
# script regenerates the baselines from the fresh captures, gates
# them through the luminance guard (tools/visualRegression/
# guard.mjs, issue #101), proves them with an in-job re-capture and
# re-compare, and the commit-pr-baselines job below pushes them
# onto the PR branch — no manual update dispatch. Since the
# 2026-11-02 gating above, this auto-commit cycle runs on release
# PRs only. workflow_dispatch runs never take this path (update
# mode has its own commit job, commit-baselines). See
# docs/android-visual-regression.md.
#
# Bot-head pass-through (Stephen's directive, 2026-10-24): the
# follow-up run a bot baseline push triggers used to re-capture the
# whole set just to compare it against baselines the previous run
# had already proved green in-job before committing. The
# visual-regression job now detects that its head commit IS the VR
# bot's own baseline commit (bot author + the auto-commit message +
# baseline files only) and passes immediately instead.
#
# Narrow-viewport variant (Stephen's directive, 2026-10-24): every
# capture mode also re-captures ONLY the RecipesPage stories with
# the emulator display switched to a 345.6dp logical width +
# font_scale 1.3 (the phone settings behind eciperay #205, whose
# fix moved zero standard baselines — the standard surface is
# 540dp wide and never starves the row). Variant baselines are the
# same stories' baselines with a "--narrow" filename segment and
# flow through the same compare / guard / auto-commit path as the
# standard set. See docs/android-visual-regression.md.
#
# Sharded capture (issue #432 phase 2): the plan job below
# computes the capture scope once and splits it across a matrix
# of parallel visual-regression emulator jobs
# (tools/visualRegression/shardScope.mjs — up to 4 shards; runs at
# or below the tooling's serial threshold, and update dispatches,
# stay on one shard). Each shard runs only its slice's compare
# pass; the merge-verify job unions the shards' captures, runs
# the commit gate + luminance guard over the union, and runs the
# phase-1 verification re-capture once over the merged staged set
# before commit-pr-baselines pushes anything. The shards are
# disjoint and their union is exactly the scope, so a sharded run
# stages and proves the set a serial run on the same head would.
name: React Native storybook VR

on:
  # No paths filter and no push trigger (Stephen's directive,
  # 2026-11-02 — see the header comment): the heavy jobs gate
  # themselves on the PR head branch, and release PR diffs
  # (manifests/changelogs only) would never match the old filter.
  # The types list restates the defaults plus `labeled` so that
  # adding the `android-sanity` label starts a run (2026-11-03);
  # the jobs' `if:` conditions confine label-triggered runs to
  # the sanity job, and only when the added label IS
  # `android-sanity`.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: "compare against baselines, update baselines, or run the #162 sanity check"
        type: choice
        options:
          - compare
          - update
          - sanity
        default: compare
      scope:
        description: "compare runs only (issue #114): the full capture set, or only the stories affected by this branch's diff against the default branch"
        type: choice
        options:
          - full
          - auto
        default: full

permissions:
  contents: read

concurrency:
  group: android-storybook-vr-${{ github.ref }}${{ github.event.action == 'labeled' && format('-labeled-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true
  # Concurrency acts on whole runs, never individual jobs, so a run
  # cannot cancel its own commit job mid-push: the push is the
  # commit job's last act, and the follow-up run it triggers (the
  # baseline push uses the changesets PAT — see
  # commit-pr-baselines) can only start once that push has landed.
  # Label-triggered runs get their own per-label group (the suffix
  # above): adding a label must not cancel an in-progress heavy
  # run on the same PR, and an unrelated label event must not
  # cancel a sanity run the `android-sanity` label started.

jobs:
  # Shard plan (issue #432 phase 2): decide the run's shape ONCE,
  # before any emulator boots — the bot-head pass-through, the
  # #114 capture scope, and how many parallel shards the scope
  # splits into (shardScope.mjs: at or below the serial threshold,
  # and for update dispatches, exactly one shard — the pre-#432
  # shape). The matrix jobs and the merge-verify job consume this
  # job's outputs plus the scope artifact uploaded here; the scope
  # decision is a pure function of the PR's changed files, so
  # computing it once (instead of identically in every shard)
  # removes a whole class of shard disagreement. Gated exactly
  # like the heavy jobs it feeds.
  plan:
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'labeled' && startsWith(github.head_ref, 'changeset-release/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'sanity')
    outputs:
      skip: ${{ steps.vrbot.outputs.skip }}
      shards: ${{ steps.shardplan.outputs.shards }}
      shard_count: ${{ steps.shardplan.outputs.shard_count }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Bot-head pass-through (Stephen's directive, 2026-10-24):
      # when the head commit is the VR bot's own baseline commit,
      # the baselines it carries were already proved green in-job
      # (luminance guard + re-compare) by the run that created the
      # commit, so re-capturing everything is pure waste. All three
      # conditions must hold: authored by github-actions[bot], the
      # exact auto-commit subject, and every changed file a
      # colocated VR baseline (src/**/__snapshots__/*.png, issue
      # #530) or the VR coverage listing the commit jobs refresh
      # alongside them (issue #284:
      # docs/android-visual-regression.md). A maintainer merge or
      # any later commit changes the head and the full run resumes.
      # Update dispatches are excluded on purpose: an explicit
      # regeneration request always runs in full. Manual update
      # commits also never qualify: commit-baselines gives them a
      # distinct subject (see that job), because update mode runs
      # neither the luminance guard nor the in-job re-compare — a
      # later compare on such a head must capture for real.
      - name: Detect VR bot baseline head
        id: vrbot
        if: github.event_name == 'pull_request' || inputs.mode == 'compare'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          skip=false
          author="$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA" --jq '.author.login // ""')"
          subject="$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA" --jq '.commit.message | split("\n")[0]')"
          if [ "$author" = "github-actions[bot]" ] && [ "$subject" = "chore(vr): update Android Storybook baselines" ]; then
            outside="$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA" --jq '[.files[].filename | select(((startswith("src/") and contains("/__snapshots__/") and endswith(".png")) or . == "docs/android-visual-regression.md") | not)] | length')"
            if [ "$outside" = "0" ]; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then
            echo "Head commit $HEAD_SHA is the VR bot's own baseline commit: the run that created it regenerated these baselines, passed them through the luminance guard, and re-verified them in-job before committing. Passing without re-capturing (Stephen's directive, 2026-10-24)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v7
        if: steps.vrbot.outputs.skip != 'true'
        with:
          node-version: 22

      # Affected-stories scoping (issue #114): decide the capture
      # set BEFORE the emulator boots. PR runs map the PR's changed
      # files through the component import graph
      # (tools/visualRegression/scope.mjs); a dispatch with
      # scope=auto diffs this branch against the default branch.
      # Anything shared or unmappable, the vr-full-run PR label, or
      # any failure here degrades to the FULL set — never a smaller
      # one. capture-compare.sh reads the decision from
      # /tmp/dsvr-scope.json; update mode ignores it.
      - name: Compute VR capture scope
        if: steps.vrbot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DSVR_FORCE_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'vr-full-run') }}
          DSVR_SCOPE_INPUT: ${{ inputs.scope }}
        run: |
          scope_file=/tmp/dsvr-scope.json
          changed_file=/tmp/dsvr-changed-files.txt
          have_list=0
          if [ "$DSVR_FORCE_FULL" = "true" ]; then
            echo "The vr-full-run label is set: forcing the full capture set."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            if gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename' > "$changed_file" && [ -s "$changed_file" ]; then
              have_list=1
            else
              echo "Could not list the PR's changed files; falling back to the full capture set."
            fi
          elif [ "$DSVR_SCOPE_INPUT" = "auto" ]; then
            if gh api "repos/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...${{ github.sha }}" --jq '.files[].filename' > "$changed_file" && [ -s "$changed_file" ]; then
              have_list=1
            else
              echo "Could not diff against the default branch; falling back to the full capture set."
            fi
          fi
          if [ "$have_list" = "1" ]; then
            node tools/visualRegression/scope.mjs --changed-files "$changed_file" --out "$scope_file" || rm -f "$scope_file"
          else
            node tools/visualRegression/scope.mjs --force-full --out "$scope_file" || rm -f "$scope_file"
          fi
          if [ ! -f "$scope_file" ]; then
            echo "Scope computation failed; falling back to the full capture set."
            printf '{"mode":"full","reasons":["scope computation failed in CI; full run"],"standard":[],"narrow":[]}' > "$scope_file"
          fi
          { echo "### VR capture scope (#114)"; echo '```json'; cat "$scope_file"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # shardScope.mjs --plan is the single place the shard count
      # is decided (its serial threshold is a named setting there).
      # A bot head needs no plan — but the outputs must still be
      # set, or the matrix jobs' fromJSON would have nothing to
      # expand (they are skipped by their own if: on a bot head,
      # before the matrix matters).
      - name: Plan VR capture shards
        id: shardplan
        env:
          DSVR_FORCE_SERIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'update' }}
        run: |
          if [ "${{ steps.vrbot.outputs.skip }}" = "true" ]; then
            echo "shards=[0]" >> "$GITHUB_OUTPUT"
            echo "shard_count=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          force=""
          if [ "$DSVR_FORCE_SERIAL" = "true" ]; then
            force="--force-serial"
          fi
          plan="$(node tools/visualRegression/shardScope.mjs --scope /tmp/dsvr-scope.json --plan $force)"
          echo "shards=$(printf '%s' "$plan" | node -pe 'JSON.stringify(JSON.parse(require("node:fs").readFileSync(0, "utf8")).shards)')" >> "$GITHUB_OUTPUT"
          echo "shard_count=$(printf '%s' "$plan" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).shardCount')" >> "$GITHUB_OUTPUT"
          { echo "### VR capture shards (#432 phase 2)"; echo '```json'; echo "$plan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VR capture scope
        if: steps.vrbot.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dsvr-scope
          path: /tmp/dsvr-scope.json
          if-no-files-found: error

  visual-regression:
    # Release-only PR gating (Stephen's directive, 2026-11-02):
    # PR runs only for changesets release branches; dispatched
    # compare/update runs remain the manual path. Label-triggered
    # runs never start this job (2026-11-03): a labeled event runs
    # the sanity job only, even on a release PR. The plan job has
    # already applied the bot-head pass-through (2026-10-24): a
    # bot baseline head skips this job entirely.
    #
    # Sharding (issue #432 phase 2): this job is a matrix over the
    # plan job's shards. On PR runs each shard runs ONLY its
    # slice's compare pass (capture-compare.sh mode pr-shard) and
    # uploads its captures; regeneration is a global decision the
    # merge-verify job makes over the union. Dispatched compare
    # runs shard the same way (mode compare against the shard
    # scope); update dispatches are planned as a single shard and
    # run the serial update flow unchanged.
    needs: plan
    if: >-
      needs.plan.outputs.skip != 'true' &&
      ((github.event_name == 'pull_request' && github.event.action != 'labeled' && startsWith(github.head_ref, 'changeset-release/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'sanity'))
    strategy:
      # A failing shard must not cancel the others: their captures
      # and classifications are the evidence for what failed, and
      # on PR runs the merge job — not cancellation — is what
      # refuses an incomplete union.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    # 60: a shard captures only its slice, once — the serial job's
    # second (verification) pass lives in merge-verify now.
    timeout-minutes: 60
    env:
      # Gradle local build cache (task-output reuse); see the setup-gradle step.
      GRADLE_OPTS: -Dorg.gradle.caching=true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storybook/package-lock.json

      - name: Enable Corepack (pinned npm)
        run: corepack enable npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Gradle caching: restores ~/.gradle (wrapper distribution,
      # downloaded dependencies, and the local build cache) so
      # assembleRelease in capture-compare.sh reuses prior task
      # outputs instead of rebuilding from scratch. The android/
      # project is regenerated by `expo prebuild` each run, so the
      # task-output cache (org.gradle.caching) is what saves the
      # compile work, not up-to-date checks. cache-read-only is
      # off because this workflow only triggers on PRs and
      # dispatches: the action's default (write from the default
      # branch only) would never save a cache here.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Download VR capture scope
        uses: actions/download-artifact@v8
        with:
          name: dsvr-scope
          path: ${{ runner.temp }}/dsvr-scope

      # This shard's slice of the plan job's scope decision
      # (shardScope.mjs: deterministic round-robin; the slices are
      # disjoint and union to the decision). Update mode ignores
      # scope files entirely, so it needs no slice.
      - name: Compute this shard's capture scope
        if: inputs.mode != 'update'
        run: node tools/visualRegression/shardScope.mjs --scope "${{ runner.temp }}/dsvr-scope/dsvr-scope.json" --index ${{ matrix.shard }} --count ${{ needs.plan.outputs.shard_count }} --out /tmp/dsvr-shard-scope.json

      - name: Install host app dependencies
        working-directory: apps/storybook
        run: npm ci

      - name: Generate storybook.requires
        working-directory: apps/storybook
        run: npm run generate

      # Start the APK build in the background so it overlaps the
      # emulator boot (AVD generation and the capture step's boot
      # both wait on the emulator, not on the build).
      # capture-compare.sh blocks on it via wait-for-build.sh. Runs
      # detached (setsid) so it outlives this step.
      - name: Start APK build
        run: |
          rm -f /tmp/dsvr-build.status /tmp/dsvr-build.log
          setsid bash -c 'bash tools/visualRegression/ci/build-apk.sh > /tmp/dsvr-build.log 2>&1; echo $? > /tmp/dsvr-build.status' < /dev/null > /dev/null 2>&1 &

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD caching (issue #114): boot from a cached,
      # already-first-booted AVD instead of creating one and
      # paying first-boot setup on every run. The key spells out
      # the emulator config (API level, target, arch, profile) and
      # hashes this workflow + the capture script (which pins the
      # display setup), so any change to how the emulator is
      # configured misses the cache and regenerates it. On a miss —
      # or a restored cache whose AVD is absent/corrupt — the
      # generation step below creates and first-boots the AVD and
      # the cache saves it at job end; a bad cache therefore
      # degrades to a cold boot, never a failed or wrong run. If a
      # cached AVD ever misbehaves persistently, bump the key's
      # avd- prefix version to invalidate every entry.
      - name: Cache the emulator AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: ~/.android/avd
          key: avd-34-google_apis-x86_64-pixel_6-${{ hashFiles('.github/workflows/android-storybook.yml', 'tools/visualRegression/ci/capture-compare.sh') }}

      - name: Check the cached AVD
        id: avd-check
        run: |
          if [ -d "$HOME/.android/avd/test.avd" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true' || steps.avd-check.outputs.present != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: echo "Generated AVD snapshot for caching."

      # The runner executes each line of `script:` in a separate
      # shell process, so the flow lives in a checked-in script file
      # (a `cd` in the workflow block would not survive to the next
      # line — learned on this PR's first run). DSVR_SCOPE_FILE
      # points the driver at this shard's slice; update mode
      # ignores it (and the slice step above did not run for it).
      - name: Capture and compare story screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DSVR_SCOPE_FILE: /tmp/dsvr-shard-scope.json
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash tools/visualRegression/ci/capture-compare.sh "${{ github.event_name == 'pull_request' && 'pr-shard' || inputs.mode }}"

      - name: Upload screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsvr-output-${{ matrix.shard }}
          path: |
            /tmp/dsvr-out
            /tmp/dsvr-out-narrow
          if-no-files-found: ignore

      # PR runs: hand this shard's captures + classification to
      # the merge-verify job (artifact name dsvr-shard-<index> is
      # the contract ci/mergeShards.mjs reads). Uploaded even when
      # the capture step failed, so the merge job and reviewers
      # can see every shard's evidence; a shard that produced no
      # result file fails this step loudly rather than silently
      # shrinking the union.
      - name: Upload shard captures and result
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dsvr-shard-${{ matrix.shard }}
          path: |
            /tmp/dsvr-out
            /tmp/dsvr-out-narrow
            /tmp/dsvr-shard-result.json
          if-no-files-found: error

      # Update mode wrote the baselines in-tree at their colocated
      # paths; capture-compare.sh materialized them into the
      # canonical tree this artifact carries (issue #530), which
      # the commit-baselines job publishes back into the tree.
      - name: Upload regenerated baselines (update mode)
        if: inputs.mode == 'update'
        uses: actions/upload-artifact@v7
        with:
          name: dsvr-baselines
          path: /tmp/dsvr-baselines-tree
          if-no-files-found: error

  # Shard merge + verification (issue #432 phase 2), PR runs
  # only: union the matrix shards' captures (ci/mergeShards.mjs —
  # strict: a missing shard, a non-diff shard failure, or a
  # capture two shards both produced all fail here, so no staged
  # set is ever built from an incomplete or colliding union), run
  # the pixel-diff commit gate + luminance guard over the union
  # (capture-compare.sh mode stage-merged — no emulator needed),
  # and, when the gate staged anything, run the phase-1
  # verification re-capture ONCE over the merged staged set on a
  # single emulator (mode verify-merged) and publish the
  # proven-green set for commit-pr-baselines. When every shard is
  # clean, or the gate stages zero files, no emulator boots here
  # at all and nothing is published — the same outcomes the serial
  # flow produced. This job stays read-only like the capture jobs;
  # commit-pr-baselines remains the only job that pushes.
  merge-verify:
    needs: [plan, visual-regression]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      startsWith(github.head_ref, 'changeset-release/') &&
      needs.plan.outputs.skip != 'true'
    # Set by the "Note PR auto-commit readiness" step when the
    # merged staged set was proved green in-job; gates the
    # commit-pr-baselines job.
    outputs:
      pr_autocommit_ready: ${{ steps.autocommit.outputs.ready }}
    runs-on: ubuntu-latest
    # 90: the verification re-capture is scoped to the staged set
    # (phase 1); its full-scope fallback is one more capture pass,
    # plus this job's own boot + build when it runs at all.
    timeout-minutes: 90
    env:
      # Gradle local build cache (task-output reuse); see the setup-gradle step.
      GRADLE_OPTS: -Dorg.gradle.caching=true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storybook/package-lock.json

      - name: Download shard captures
        uses: actions/download-artifact@v8
        with:
          pattern: dsvr-shard-*
          path: ${{ runner.temp }}/dsvr-shards

      - name: Download VR capture scope
        uses: actions/download-artifact@v8
        with:
          name: dsvr-scope
          path: ${{ runner.temp }}/dsvr-scope

      - name: Merge shard captures
        id: merge
        run: |
          node tools/visualRegression/ci/mergeShards.mjs --shards-dir "${{ runner.temp }}/dsvr-shards" --expected ${{ needs.plan.outputs.shard_count }} --out /tmp/dsvr-out --out-narrow /tmp/dsvr-out-narrow --result /tmp/dsvr-merge-result.json
          verdict="$(node -pe 'JSON.parse(require("node:fs").readFileSync("/tmp/dsvr-merge-result.json", "utf8")).verdict')"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = "clean" ]; then
            echo "Every shard's compare was clean: no diffs and no missing baselines — baselines already match; nothing to stage, verify, or commit." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The commit gate + luminance guard over the union, exactly
      # as the serial flow runs them over its in-job captures. A
      # guard trip fails this step (and the job): nothing is
      # verified and nothing is committed.
      - name: Stage the union and run the luminance guard
        id: stage
        if: steps.merge.outputs.verdict == 'regen'
        run: |
          bash tools/visualRegression/ci/capture-compare.sh stage-merged
          echo "staged=$(node -pe 'JSON.parse(require("node:fs").readFileSync("/tmp/dsvr-stage-result.json", "utf8")).staged')" >> "$GITHUB_OUTPUT"

      # The verification emulator setup below runs ONLY when the
      # gate staged at least one file: with zero staged files the
      # phase-1 rule skips verification outright (the staged set is
      # the committed set the compare passes already proved), so
      # the common no-change run never boots this job's emulator.
      - name: Enable Corepack (pinned npm)
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        run: corepack enable npm

      - uses: actions/setup-java@v6
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        with:
          distribution: temurin
          java-version: 17

      # Gradle caching — see the visual-regression job.
      - uses: gradle/actions/setup-gradle@v6
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        with:
          cache-read-only: false

      - name: Install host app dependencies
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        working-directory: apps/storybook
        run: npm ci

      - name: Generate storybook.requires
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        working-directory: apps/storybook
        run: npm run generate

      # Start the APK build in the background so it overlaps the
      # emulator boot — see the visual-regression job.
      - name: Start APK build
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        run: |
          rm -f /tmp/dsvr-build.status /tmp/dsvr-build.log
          setsid bash -c 'bash tools/visualRegression/ci/build-apk.sh > /tmp/dsvr-build.log 2>&1; echo $? > /tmp/dsvr-build.status' < /dev/null > /dev/null 2>&1 &

      - name: Enable KVM
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the emulator AVD
        id: avd-cache
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        uses: actions/cache@v6
        with:
          path: ~/.android/avd
          key: avd-34-google_apis-x86_64-pixel_6-${{ hashFiles('.github/workflows/android-storybook.yml', 'tools/visualRegression/ci/capture-compare.sh') }}

      - name: Check the cached AVD
        id: avd-check
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        run: |
          if [ -d "$HOME/.android/avd/test.avd" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate AVD snapshot for caching
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0' && (steps.avd-cache.outputs.cache-hit != 'true' || steps.avd-check.outputs.present != 'true')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: echo "Generated AVD snapshot for caching."

      # DSVR_SCOPE_FILE points at the ORIGINAL scope decision:
      # verify-merged's scoped pass uses the verify-scope file it
      # computes from the staged set, and its full-scope fallback
      # needs the run's original scope, not a shard slice.
      - name: Verify the merged staged baselines
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DSVR_SCOPE_FILE: ${{ runner.temp }}/dsvr-scope/dsvr-scope.json
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash tools/visualRegression/ci/capture-compare.sh verify-merged

      # PR auto-commit: capture-compare.sh (mode verify-merged)
      # drops a marker file in /tmp when it proved the merged
      # staged baselines green in-job (luminance guard + re-compare).
      # Surface that as a job output for commit-pr-baselines.
      - name: Note PR auto-commit readiness
        id: autocommit
        if: always()
        run: |
          if [ -f /tmp/dsvr-pr-autocommit-ready ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "This PR's sharded compare run found screenshot diffs. CI regenerated the baselines from the union of the shards' captures, passed them through the luminance guard (issue #101), and re-verified the merged staged set in-job; the commit-pr-baselines job pushes them to this branch as github-actions[bot] for review in the PR diff." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PR-regenerated baselines
        if: steps.autocommit.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dsvr-pr-baselines
          path: /tmp/dsvr-pr-baselines
          if-no-files-found: error

  # Update mode only: commit the baselines the visual-regression
  # job just regenerated back onto the dispatched branch, so they
  # appear in the PR diff for review instead of living only in a
  # workflow artifact someone has to download and commit by hand
  # (Stephen's directive, 2026-10-23). This is the only job with
  # write access; the capture jobs above stay read-only. The push
  # uses the changesets PAT (issue #487): a GITHUB_TOKEN push
  # triggers no follow-up runs — GitHub creates no
  # pull_request_target run for token pushes, which stranded the
  # required blocked-label-gate check on PR #453's bot-pushed head
  # (the parking behavior was verified live on PR #97,
  # 2026-10-23) — while a PAT push triggers every workflow,
  # the gate included.
  commit-baselines:
    needs: visual-regression
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'update'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Baselines must land via PR branches so Stephen reviews them
      # in a diff; committing them straight to the default branch
      # would bypass that review.
      - name: Refuse the default branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::mode=update was dispatched from the default branch (${{ github.ref_name }}). Dispatch it from a PR branch instead, so the regenerated baselines are committed to that branch and reviewed in the PR diff."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download regenerated baselines
        uses: actions/download-artifact@v8
        with:
          name: dsvr-baselines
          path: ${{ runner.temp }}/dsvr-baselines

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Issue #530: the artifact is the canonical tree; publish it
      # into the colocated committed layout (mirroring — a
      # baseline absent from the tree is deleted).
      - name: Publish baselines into the tree
        run: node tools/visualRegression/baselinesLayout.mjs publish --from "${{ runner.temp }}/dsvr-baselines"

      # Issue #284: refresh the docs coverage listing from the
      # synced baselines so it lands in the same bot commit —
      # otherwise the scope test goes red on the follow-up run
      # until a human refreshes the table by hand.
      - name: Refresh the VR coverage listing
        run: node tools/visualRegression/coverageListing.mjs

      # The subject deliberately differs from the PR auto-commit
      # subject: update mode runs neither the luminance guard nor
      # the in-job re-compare, so its commits must never match the
      # visual-regression job's bot-head pass-through (which treats
      # an exact-subject head as already verified). A later compare
      # on a branch headed by this commit captures for real.
      - name: Commit and push if baselines changed
        run: |
          if [ -z "$(git status --porcelain -- src docs/android-visual-regression.md)" ]; then
            echo "Baselines unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src docs/android-visual-regression.md
          git commit -m "chore(vr): update Android Storybook baselines (manual update)"
          git push origin "HEAD:${{ github.ref_name }}"

  # PR runs only: push the baselines the visual-regression job
  # regenerated and PROVED GREEN IN-JOB (luminance guard + a second
  # capture pass compared against the regenerated set — see
  # capture-compare.sh mode pr-autocommit) onto the PR's head
  # branch, so an intentional visual change lands its new baselines
  # in the same PR without a manual update dispatch (Stephen's
  # directive, 2026-10-23). Mirrors commit-baselines above: job-level
  # write permission, the capture job stays read-only, and the
  # default branch is refused — baselines only ever land via a PR
  # branch, never on main. Same-repo PRs only: a fork's head branch
  # is not pushable from here.
  #
  # The push uses the changesets PAT (issue #487), so the
  # follow-up run starts on its own: with the built-in token,
  # GitHub created no pull_request_target run for the bot-pushed
  # head, stranding the required blocked-label-gate check
  # (PR #453). The follow-up run's visual-regression job detects
  # the bot head and passes it immediately — the in-job
  # re-compare is the verification — and the bot never commits
  # twice for the same change (no loop).
  commit-pr-baselines:
    needs: merge-verify
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      startsWith(github.head_ref, 'changeset-release/') &&
      needs.merge-verify.outputs.pr_autocommit_ready == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Defense in depth on top of the gating above: a head branch
      # named like the default branch still gets refused here,
      # exactly as the update-mode job refuses a main dispatch.
      - name: Refuse the default branch
        if: github.head_ref == github.event.repository.default_branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "::error::Refusing to push regenerated baselines to the default branch ($HEAD_REF). Baselines land via PR branches so they are reviewed in the PR diff."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download PR-regenerated baselines
        uses: actions/download-artifact@v8
        with:
          name: dsvr-pr-baselines
          path: ${{ runner.temp }}/dsvr-pr-baselines

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Issue #530: the artifact is the canonical (staged) tree;
      # publish it into the colocated committed layout
      # (mirroring — a baseline absent from the tree is deleted).
      - name: Publish baselines into the tree
        run: node tools/visualRegression/baselinesLayout.mjs publish --from "${{ runner.temp }}/dsvr-pr-baselines"

      # Issue #284: same listing refresh as the update-mode job —
      # the refreshed table lands in this bot commit, so the
      # follow-up run's scope test passes with no manual doc edit.
      - name: Refresh the VR coverage listing
        run: node tools/visualRegression/coverageListing.mjs

      - name: Commit and push regenerated baselines
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- src docs/android-visual-regression.md)" ]; then
            echo "Baselines unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src docs/android-visual-regression.md
          git commit -m "chore(vr): update Android Storybook baselines"
          git push origin "HEAD:$HEAD_REF"

  # The #162 sanity check (issue #43 acceptance): reintroduce the
  # SearchField lineHeight bug via the patch in
  # tools/visualRegression/sanity/ and prove the pipeline FAILS the
  # SearchField screenshot on Android. The patch restores the pre-fix
  # text glyph (numeric lineHeight = fontSize) and removes the
  # clip-box hardening — on web the same change renders identically,
  # which is the asymmetry that let #162 ship. Runs on demand: add
  # the `android-sanity` label to a PR, or dispatch with mode=sanity.
  # Adding the label starts a run (the trigger includes the
  # `labeled` activity type — Stephen's directive, 2026-11-03): on
  # a label-triggered run this is the ONLY job that runs, and only
  # when the added label is `android-sanity` itself; a `labeled`
  # event for any other label starts a run in which every job
  # skips. On ordinary PR events the label's presence at run start
  # is what counts, as before.
  # Succeeds only if the mutated capture differs from the clean one.
  sanity:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'sanity') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'android-sanity') ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'android-sanity'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Gradle local build cache (task-output reuse); see the setup-gradle step.
      GRADLE_OPTS: -Dorg.gradle.caching=true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storybook/package-lock.json

      - name: Enable Corepack (pinned npm)
        run: corepack enable npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Gradle caching — see the visual-regression job.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Install host app dependencies
        working-directory: apps/storybook
        run: npm ci

      - name: Generate storybook.requires
        working-directory: apps/storybook
        run: npm run generate

      # Start the APK build in the background so it overlaps the
      # emulator boot (AVD generation and the capture step's boot
      # both wait on the emulator, not on the build).
      # capture-compare.sh blocks on it via wait-for-build.sh. Runs
      # detached (setsid) so it outlives this step.
      - name: Start APK build
        run: |
          rm -f /tmp/dsvr-build.status /tmp/dsvr-build.log
          setsid bash -c 'bash tools/visualRegression/ci/build-apk.sh > /tmp/dsvr-build.log 2>&1; echo $? > /tmp/dsvr-build.status' < /dev/null > /dev/null 2>&1 &

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD caching (issue #114) — same cache and key as the
      # visual-regression job; see the comment there.
      - name: Cache the emulator AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: ~/.android/avd
          key: avd-34-google_apis-x86_64-pixel_6-${{ hashFiles('.github/workflows/android-storybook.yml', 'tools/visualRegression/ci/capture-compare.sh') }}

      - name: Check the cached AVD
        id: avd-check
        run: |
          if [ -d "$HOME/.android/avd/test.avd" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true' || steps.avd-check.outputs.present != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: echo "Generated AVD snapshot for caching."

      - name: Capture SearchField clean vs mutated
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash tools/visualRegression/ci/capture-sanity.sh

      - name: Upload sanity captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsvr-sanity-output
          path: |
            /tmp/dsvr-clean
            /tmp/dsvr-mutated
            /tmp/dsvr-sanity-diff
          if-no-files-found: ignore
