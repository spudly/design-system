# On-device Storybook visual regression for Android (issue #43).
#
# Separate from Chromatic (which gates the WEB Storybook): this job
# renders the same CSF stories in the Expo host app
# (apps/storybook) on an Android emulator and pixel-compares
# screenshots against baselines committed under
# tools/visual-regression/baselines/. See
# docs/android-visual-regression.md for the full workflow, including
# how baselines are generated and updated.
#
# Scoping: GitHub Actions minutes are on paid overage until
# 2026-11-01, so the job is path-filtered to the surfaces that can
# change a story screenshot (library source, the host app, the VR
# tooling, this workflow) instead of running on every PR.
name: Android Storybook VR

on:
  pull_request:
    paths:
      - "src/**"
      - "apps/storybook/**"
      - "tools/visual-regression/**"
      - ".github/workflows/android-storybook.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "compare against baselines, update baselines, or run the #162 sanity check"
        type: choice
        options:
          - compare
          - update
          - sanity
        default: compare

permissions:
  contents: read

concurrency:
  group: android-storybook-vr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    if: github.event_name == 'pull_request' || inputs.mode != 'sanity'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storybook/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install host app dependencies
        working-directory: apps/storybook
        run: npm ci

      - name: Generate storybook.requires
        working-directory: apps/storybook
        run: npm run generate

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture and compare story screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            set -e
            cd apps/storybook
            npx expo prebuild --platform android --no-install
            (cd android && ./gradlew assembleDebug --console=plain -q)
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # Deterministic capture surface: fixed density + font scale.
            adb shell wm density 320
            adb shell settings put system font_scale 1.0
            adb reverse tcp:8081 tcp:8081
            (npx expo start --localhost > /tmp/metro.log 2>&1 &)
            for i in $(seq 1 60); do curl -sf http://localhost:8081/status >/dev/null && break || sleep 2; done
            MODE="${{ inputs.mode }}"
            if [ "$MODE" = "update" ]; then
              node ../../tools/visual-regression/run.mjs --update --out /tmp/dsvr-out
            else
              node ../../tools/visual-regression/run.mjs --out /tmp/dsvr-out
            fi

      - name: Upload screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dsvr-output
          path: /tmp/dsvr-out
          if-no-files-found: ignore

      - name: Upload regenerated baselines (update mode)
        if: inputs.mode == 'update'
        uses: actions/upload-artifact@v5
        with:
          name: dsvr-baselines
          path: tools/visual-regression/baselines
          if-no-files-found: error

  # The #162 sanity check (issue #43 acceptance): reintroduce the
  # SearchField lineHeight bug via the patch in
  # tools/visual-regression/sanity/ and prove the pipeline FAILS the
  # SearchField screenshot on Android. The patch restores the pre-fix
  # text glyph (numeric lineHeight = fontSize) and removes the
  # clip-box hardening — on web the same change renders identically,
  # which is the asymmetry that let #162 ship. Runs on demand: add
  # the `android-sanity` label to a PR, or dispatch with mode=sanity.
  # Succeeds only if the mutated capture differs from the clean one.
  sanity:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'sanity') || contains(github.event.pull_request.labels.*.name, 'android-sanity')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storybook/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install host app dependencies
        working-directory: apps/storybook
        run: npm ci

      - name: Generate storybook.requires
        working-directory: apps/storybook
        run: npm run generate

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture SearchField clean vs mutated
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            set -e
            cd apps/storybook
            npx expo prebuild --platform android --no-install
            (cd android && ./gradlew assembleDebug --console=plain -q)
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm density 320
            adb shell settings put system font_scale 1.0
            adb reverse tcp:8081 tcp:8081
            (npx expo start --localhost > /tmp/metro.log 2>&1 &)
            for i in $(seq 1 60); do curl -sf http://localhost:8081/status >/dev/null && break || sleep 2; done
            DRIVER="node ../../tools/visual-regression/run.mjs"
            # Clean capture (SearchField stories, one theme is enough).
            $DRIVER --stories searchfield --themes light_warmHarvest --out /tmp/dsvr-clean
            # Reintroduce the #162 bug and recapture. Only the JS
            # bundle changes, so a force-stop + relaunch re-fetches
            # it from Metro — no native rebuild.
            (cd ../.. && git apply tools/visual-regression/sanity/searchfield-162.patch)
            adb shell am force-stop dev.spudly.designsystem.storybook
            $DRIVER --stories searchfield --themes light_warmHarvest --out /tmp/dsvr-mutated
            # The job passes only if the comparison FAILS (exit 1).
            if $DRIVER --from-dir /tmp/dsvr-mutated/actual --baselines /tmp/dsvr-clean/actual --out /tmp/dsvr-sanity-diff; then
              echo "::error::Sanity check failed: the #162 mutation produced NO screenshot diff — the pipeline is not sensitive to the bug."
              exit 1
            fi
            echo "Sanity check passed: the #162 mutation changed the SearchField screenshot on Android."

      - name: Upload sanity captures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dsvr-sanity-output
          path: |
            /tmp/dsvr-clean
            /tmp/dsvr-mutated
            /tmp/dsvr-sanity-diff
          if-no-files-found: ignore
