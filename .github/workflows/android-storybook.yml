# On-device Storybook visual regression for Android (issue #43).
#
# Separate from Chromatic (which gates the WEB Storybook): this job
# renders the same CSF stories in the Expo host app
# (apps/storybook) on an Android emulator and pixel-compares
# screenshots against baselines committed under
# tools/visual-regression/baselines/. See
# docs/android-visual-regression.md for the full workflow, including
# how baselines are generated and updated.
#
# Scoping: GitHub Actions minutes are on paid overage until
# 2026-11-01, so the job is path-filtered to the surfaces that can
# change a story screenshot (library source, the host app, the VR
# tooling, this workflow) instead of running on every PR.
#
# PR runs auto-commit regenerated baselines (Stephen's directive,
# 2026-10-23): when the compare finds screenshot diffs, the capture
# script regenerates the baselines from the fresh captures, gates
# them through the luminance guard (tools/visual-regression/
# guard.mjs, issue #101), proves them with an in-job re-capture and
# re-compare, and the commit-pr-baselines job below pushes them
# onto the PR branch — no manual update dispatch. Pushes to main
# and workflow_dispatch runs never take this path (update mode has
# its own commit job, commit-baselines). See
# docs/android-visual-regression.md.
#
# Bot-head pass-through (Stephen's directive, 2026-10-24): the
# follow-up run a bot baseline push triggers used to re-capture the
# whole set just to compare it against baselines the previous run
# had already proved green in-job before committing. The
# visual-regression job now detects that its head commit IS the VR
# bot's own baseline commit (bot author + the auto-commit message +
# baseline files only) and passes immediately instead.
name: Android Storybook VR

on:
  pull_request:
    paths:
      - "src/**"
      - "apps/storybook/**"
      - "tools/visual-regression/**"
      - ".github/workflows/android-storybook.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "compare against baselines, update baselines, or run the #162 sanity check"
        type: choice
        options:
          - compare
          - update
          - sanity
        default: compare

permissions:
  contents: read

concurrency:
  group: android-storybook-vr-${{ github.ref }}
  cancel-in-progress: true
  # Concurrency acts on whole runs, never individual jobs, so a run
  # cannot cancel its own commit job mid-push. The bot's baseline
  # push starts a follow-up run that GitHub parks as
  # "action_required" (see commit-pr-baselines), so it cannot
  # cancel a successor either.

jobs:
  visual-regression:
    if: github.event_name == 'pull_request' || inputs.mode != 'sanity'
    # Set by the "Note PR auto-commit readiness" step when a PR
    # compare run regenerated baselines and proved them green
    # in-job; gates the commit-pr-baselines job.
    outputs:
      pr_autocommit_ready: ${{ steps.autocommit.outputs.ready }}
    runs-on: ubuntu-latest
    # 120, not 90: a PR run whose compare finds diffs captures the
    # whole set twice (compare pass + in-job verification pass).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Bot-head pass-through (Stephen's directive, 2026-10-24):
      # when the head commit is the VR bot's own baseline commit,
      # the baselines it carries were already proved green in-job
      # (luminance guard + re-compare) by the run that created the
      # commit, so re-capturing everything is pure waste. All three
      # conditions must hold: authored by github-actions[bot], the
      # exact auto-commit subject, and every changed file under
      # tools/visual-regression/baselines/. A maintainer merge or
      # any later commit changes the head and the full run resumes.
      # Update dispatches are excluded on purpose: an explicit
      # regeneration request always runs in full.
      - name: Detect VR bot baseline head
        id: vrbot
        if: github.event_name == 'pull_request' || inputs.mode == 'compare'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          skip=false
          author="$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA" --jq '.author.login // ""')"
          subject="$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA" --jq '.commit.message | split("\n")[0]')"
          if [ "$author" = "github-actions[bot]" ] && [ "$subject" = "chore(vr): update Android Storybook baselines" ]; then
            outside="$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA" --jq '[.files[].filename | select(startswith("tools/visual-regression/baselines/") | not)] | length')"
            if [ "$outside" = "0" ]; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then
            echo "Head commit $HEAD_SHA is the VR bot's own baseline commit: the run that created it regenerated these baselines, passed them through the luminance guard, and re-verified them in-job before committing. Passing without re-capturing (Stephen's directive, 2026-10-24)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v7
        if: steps.vrbot.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storybook/package-lock.json

      - uses: actions/setup-java@v5
        if: steps.vrbot.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Install host app dependencies
        if: steps.vrbot.outputs.skip != 'true'
        working-directory: apps/storybook
        run: npm ci

      - name: Generate storybook.requires
        if: steps.vrbot.outputs.skip != 'true'
        working-directory: apps/storybook
        run: npm run generate

      - name: Enable KVM
        if: steps.vrbot.outputs.skip != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner executes each line of `script:` in a separate
      # shell process, so the flow lives in a checked-in script file
      # (a `cd` in the workflow block would not survive to the next
      # line — learned on this PR's first run).
      - name: Capture and compare story screenshots
        if: steps.vrbot.outputs.skip != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash tools/visual-regression/ci/capture-compare.sh "${{ github.event_name == 'pull_request' && 'pr-autocommit' || inputs.mode }}"

      - name: Upload screenshots and diffs
        if: always() && steps.vrbot.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dsvr-output
          path: /tmp/dsvr-out
          if-no-files-found: ignore

      # PR auto-commit: capture-compare.sh (mode pr-autocommit)
      # drops a marker file in /tmp when it regenerated baselines
      # AND proved them green in-job (luminance guard + re-compare).
      # Surface that as a job output for commit-pr-baselines.
      - name: Note PR auto-commit readiness
        id: autocommit
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f /tmp/dsvr-pr-autocommit-ready ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "This PR's compare run found screenshot diffs. CI regenerated the baselines from the fresh captures, passed them through the luminance guard (issue #101), and re-verified them in-job; the commit-pr-baselines job pushes them to this branch as github-actions[bot] for review in the PR diff." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PR-regenerated baselines
        if: steps.autocommit.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dsvr-pr-baselines
          path: /tmp/dsvr-pr-baselines
          if-no-files-found: error

      - name: Upload regenerated baselines (update mode)
        if: inputs.mode == 'update' && steps.vrbot.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dsvr-baselines
          path: tools/visual-regression/baselines
          if-no-files-found: error

  # Update mode only: commit the baselines the visual-regression
  # job just regenerated back onto the dispatched branch, so they
  # appear in the PR diff for review instead of living only in a
  # workflow artifact someone has to download and commit by hand
  # (Stephen's directive, 2026-10-23). This is the only job with
  # write access; the capture jobs above stay read-only. Note: the
  # bot's push does not auto-run the PR's checks — GitHub parks
  # workflow runs for GITHUB_TOKEN pushes as "action_required", so
  # the follow-up compare run starts only after a maintainer
  # approves it in the Actions UI or pushes to the branch
  # (verified live on PR #97, 2026-10-23).
  commit-baselines:
    needs: visual-regression
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'update'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Baselines must land via PR branches so Stephen reviews them
      # in a diff; committing them straight to the default branch
      # would bypass that review.
      - name: Refuse the default branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::mode=update was dispatched from the default branch (${{ github.ref_name }}). Dispatch it from a PR branch instead, so the regenerated baselines are committed to that branch and reviewed in the PR diff."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Download regenerated baselines
        uses: actions/download-artifact@v7
        with:
          name: dsvr-baselines
          path: ${{ runner.temp }}/dsvr-baselines

      - name: Sync baselines into the tree
        run: rsync -a --delete "${{ runner.temp }}/dsvr-baselines/" tools/visual-regression/baselines/

      - name: Commit and push if baselines changed
        run: |
          if [ -z "$(git status --porcelain -- tools/visual-regression/baselines)" ]; then
            echo "Baselines unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual-regression/baselines
          git commit -m "chore(vr): update Android Storybook baselines"
          git push origin "HEAD:${{ github.ref_name }}"

  # PR runs only: push the baselines the visual-regression job
  # regenerated and PROVED GREEN IN-JOB (luminance guard + a second
  # capture pass compared against the regenerated set — see
  # capture-compare.sh mode pr-autocommit) onto the PR's head
  # branch, so an intentional visual change lands its new baselines
  # in the same PR without a manual update dispatch (Stephen's
  # directive, 2026-10-23). Mirrors commit-baselines above: job-level
  # write permission, the capture job stays read-only, and the
  # default branch is refused — baselines only ever land via a PR
  # branch, never on main. Same-repo PRs only: a fork's head branch
  # is not pushable from here.
  #
  # The bot's push parks the follow-up workflow run as
  # "action_required" (the same GITHUB_TOKEN behavior verified on
  # PR #97), so the follow-up run starts only after a maintainer
  # approves it. When it does run, the visual-regression job's
  # bot-head detection passes it immediately — the in-job
  # re-compare is the verification — and the bot never commits
  # twice for the same change (no loop).
  commit-pr-baselines:
    needs: visual-regression
    if: >-
      github.event_name == 'pull_request' &&
      needs.visual-regression.outputs.pr_autocommit_ready == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Defense in depth on top of the gating above: a head branch
      # named like the default branch still gets refused here,
      # exactly as the update-mode job refuses a main dispatch.
      - name: Refuse the default branch
        if: github.head_ref == github.event.repository.default_branch
        run: |
          echo "::error::Refusing to push regenerated baselines to the default branch (${{ github.head_ref }}). Baselines land via PR branches so they are reviewed in the PR diff."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Download PR-regenerated baselines
        uses: actions/download-artifact@v7
        with:
          name: dsvr-pr-baselines
          path: ${{ runner.temp }}/dsvr-pr-baselines

      - name: Sync baselines into the tree
        run: rsync -a --delete "${{ runner.temp }}/dsvr-pr-baselines/" tools/visual-regression/baselines/

      - name: Commit and push regenerated baselines
        run: |
          if [ -z "$(git status --porcelain -- tools/visual-regression/baselines)" ]; then
            echo "Baselines unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual-regression/baselines
          git commit -m "chore(vr): update Android Storybook baselines"
          git push origin "HEAD:${{ github.head_ref }}"

  # The #162 sanity check (issue #43 acceptance): reintroduce the
  # SearchField lineHeight bug via the patch in
  # tools/visual-regression/sanity/ and prove the pipeline FAILS the
  # SearchField screenshot on Android. The patch restores the pre-fix
  # text glyph (numeric lineHeight = fontSize) and removes the
  # clip-box hardening — on web the same change renders identically,
  # which is the asymmetry that let #162 ship. Runs on demand: add
  # the `android-sanity` label to a PR, or dispatch with mode=sanity.
  # Succeeds only if the mutated capture differs from the clean one.
  sanity:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'sanity') || contains(github.event.pull_request.labels.*.name, 'android-sanity')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storybook/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install host app dependencies
        working-directory: apps/storybook
        run: npm ci

      - name: Generate storybook.requires
        working-directory: apps/storybook
        run: npm run generate

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture SearchField clean vs mutated
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash tools/visual-regression/ci/capture-sanity.sh

      - name: Upload sanity captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsvr-sanity-output
          path: |
            /tmp/dsvr-clean
            /tmp/dsvr-mutated
            /tmp/dsvr-sanity-diff
          if-no-files-found: ignore
