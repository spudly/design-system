name: chromatic

# Publishes Storybook builds to Chromatic for visual snapshot diffs
# against the accepted main-branch baseline (the check reports changes
# until they are accepted in Chromatic's UI — that is the review gate
# working).
#
# Snapshot budget: Chromatic's free tier allows 5,000 snapshots/month,
# and the old run-on-every-push model burned ~284 snapshots per build
# (142 stories × 2 themes) — 45 runs in 2026-10-19..22 alone. The
# trigger model is now:
#
# - Pushes to main: ALWAYS run. Main builds anchor the baselines that
#   PR diffs compare against, and they are comparatively rare.
# - Pull requests: run ONLY on request. Add the `visual-check` label
#   to a PR to request one snapshot run (typically once the PR is
#   merge-ready). The label is one-shot: the job removes it as soon as
#   a run actually starts, so later pushes don't silently re-burn
#   snapshots — re-add the label for another run. Two gates run before
#   the label is consumed, and a gate skip KEEPS the label, so a later
#   push (synchronize) retries automatically:
#     1. CI-green gate: the `ci` check for the PR's exact head SHA
#        must have concluded success. A pending check gets a bounded
#        wait (~5 min) inside the gate; failed/still-pending skips.
#     2. Pixel gate: PRs whose diff touches only files that cannot
#        change pixels (markdown, docs/, .github/, changesets,
#        LICENSE, .gitignore, package manifests) skip. If the diff
#        can't be determined, the run proceeds (conservative).
# - TurboSnap (onlyChanged) scopes each run's snapshots to the
#   stories affected by the change instead of the full suite.
#
# Setup (one-time, see README "Storybook previews (Chromatic)"): create a
# Chromatic project linked to this repo and store its project token as the
# CHROMATIC_PROJECT_TOKEN repository secret. Until then this workflow's
# publish step fails (confined to its own check; CI is unaffected).

on:
  # Baselines: main-branch builds are the comparison target for PR diffs.
  push:
    branches: [main]
  pull_request:
    # `labeled` makes the visual-check request work; the other types let
    # an already-labeled PR retry the gates when new commits land.
    types: [opened, reopened, synchronize, labeled]

# NOTE: concurrency lives on the job (below), not here. Workflow-level
# concurrency cancels an in-flight run for ANY new event in the group —
# including events the job's own `if` would skip (an unrelated label, a
# push after a run consumed the visual-check label) — which could kill
# a deliberately requested snapshot build mid-flight and lose it.

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level concurrency (see the note above): events rejected by
    # the job's condition never queue, so they cannot cancel an
    # accepted run; only a genuinely superseding accepted run can.
    concurrency:
      group: chromatic-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Least privilege for what this job does: check out code, read the
    # ci check-run for the gate, and remove the visual-check label.
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    # Fork PRs never receive repository secrets, so the publish step could
    # only fail there — skip them. (Dependabot PRs DO run, but need the
    # token mirrored as a Dependabot secret; see README.) PR runs
    # additionally require the visual-check label (see header), and a
    # `labeled` event for any other label must not start a run.
    if: |
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'visual-check') &&
       (github.event.action != 'labeled' || github.event.label.name == 'visual-check'))
    steps:
      - name: Gate PR snapshot runs (pixel diff + CI green)
        id: pr-gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Default when anything is undetermined: run (conservative).
          echo "run=true" >> "$GITHUB_OUTPUT"

          # --- Pixel gate ------------------------------------------------
          # Skip when every changed file is one that cannot change
          # pixels. An empty or failed diff lookup means "unknown" and
          # falls through to run.
          if files="$(gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" --name-only 2>/dev/null)" && [ -n "$files" ]; then
            visual=0
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              base="$(basename "$file")"
              case "$file" in
                *.md | docs/* | .github/*) ;;
                *)
                  case "$base" in
                    LICENSE* | .gitignore | package.json | package-lock.json) ;;
                    *) visual=1 ;;
                  esac
                  ;;
              esac
            done <<< "$files"
            if [ "$visual" -eq 0 ]; then
              echo "::notice::Skipping Chromatic for PR #${PR_NUMBER}: no changed file can change pixels. The visual-check label is kept; a later push re-checks the gates."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # --- CI-green gate ---------------------------------------------
          # The latest `ci` check run for the exact head SHA must be a
          # completed success. A still-pending run gets a bounded wait
          # (~5 min: CI here finishes in well under that, and the
          # 15-min job timeout still leaves room to publish). A failed
          # run, or one still pending after the wait, skips and keeps
          # the label for the next push.
          ci_state="missing"
          for attempt in $(seq 1 16); do
            ci_state="$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "ci" and .app.slug == "github-actions")] | sort_by(.started_at) | last | if . == null then "missing" else "\(.status):\(.conclusion)" end' \
              2>/dev/null || echo "unknown")"
            case "$ci_state" in
              completed:*) break ;;
              *)
                if [ "$attempt" -lt 16 ]; then
                  echo "ci check for ${HEAD_SHA} is '${ci_state}'; waiting 20s for it to finish (attempt ${attempt}/16)..."
                  sleep 20
                fi
                ;;
            esac
          done
          if [ "$ci_state" != "completed:success" ]; then
            echo "::notice::Skipping Chromatic for PR #${PR_NUMBER}: ci check for ${HEAD_SHA} is '${ci_state}', not completed:success. The visual-check label is kept; a later push re-checks the gates."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Gates passed: snapshotting PR #${PR_NUMBER} at ${HEAD_SHA}."

      - name: Consume the visual-check label (one-shot)
        if: github.event_name == 'pull_request' && steps.pr-gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Idempotent for the already-absent case only: a concurrent
          # run admitted on a stale event payload can reach this step
          # after another run consumed the label, and its DELETE then
          # 404s. That race must not abort publication — but
          # authorization and other API failures still fail the step.
          output="$(gh api --method DELETE "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/visual-check" 2>&1)" && delete_rc=0 || delete_rc=$?
          if [ "$delete_rc" -eq 0 ]; then
            echo "Removed the visual-check label from PR #${PR_NUMBER}: the one-shot request is consumed."
          elif grep -Eq '"status": *"404"' <<< "$output"; then
            echo "::notice::visual-check was already absent on PR #${PR_NUMBER} (consumed by a concurrent run); continuing to publish."
          else
            echo "$output" >&2
            exit 1
          fi

      - name: Checkout
        if: steps.pr-gate.outputs.run != 'false'
        uses: actions/checkout@v7
        with:
          # Chromatic needs full history to find baseline builds and to
          # scope TurboSnap change detection.
          fetch-depth: 0
          # On PRs, check out the PR head itself — not GitHub's synthetic
          # merge commit — so snapshots are built from (and attributed to)
          # exactly the commit Chromatic records for the build.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        if: steps.pr-gate.outputs.run != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.pr-gate.outputs.run != 'false'
        run: npm ci

      - name: Publish to Chromatic
        if: steps.pr-gate.outputs.run != 'false'
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # TurboSnap: snapshot only the stories this change affects
          # instead of the full suite (see the header budget note).
          onlyChanged: true
