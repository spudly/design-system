name: React Native storybook (Chromatic)

# Publishes the react-native storybook (the Expo host app in
# apps/storybook — one of the repo's two storybooks, #122; the react
# storybook is covered by chromatic.yml) to a SEPARATE Chromatic
# React Native project for visual snapshot diffs (design-system
# #302). Chromatic captures the stories on its hosted Android
# Emulator and diffs them against the accepted baseline; changes
# report as an unreviewed build until they are accepted in
# Chromatic's UI. Android only: the host app declares
# `platforms: ["android"]` in apps/storybook/app.json, matching the
# in-repo Android VR; an iOS capture path would need the iOS
# platform added plus a macOS build, which is out of this scope.
#
# This runs IN PARALLEL with the in-repo Android VR
# (android-storybook.yml, tools/visualRegression): that pipeline is
# untouched and remains the authoritative native gate during the
# parallel period. This workflow never writes baselines or touches
# tools/visualRegression.
#
# Snapshot budget: the Chromatic free tier allows 5,000
# snapshots/month SHARED with the web project. TurboSnap is NOT
# supported for React Native (per Chromatic's RN docs), so every RN
# build snapshots the full story set (~273 stories at introduction;
# per enabled platform) — the trigger model below carries the whole
# budget discipline. It mirrors the web model in chromatic.yml
# (release-finalization model, 2026-11-06), extended to RN by
# Stephen's directive of 2026-11-12:
#
# - Pushes to main: NEVER run. The original #302 model ran a full
#   build on EVERY main push ("main builds anchor the baselines"),
#   and in the Nov 2026 cycle that exhausted the shared 5,000
#   budget: 9 main pushes in 2026-11-08..12 at ~303–606 snapshots
#   each (iOS + Android until iOS capture was turned off
#   mid-cycle), plus the #302 seeding builds and the web
#   finalization builds. Baseline anchoring works the same way as
#   web without them: builds compare against the newest build with
#   accepted baselines reachable in git ancestry, so the
#   finalization run surfaces the release's accumulated visual
#   delta.
# - Pull requests: run ONLY on request AND only on the release PR.
#   Add the `visual-check-rn` label to the Version Packages PR
#   (head branch changeset-release/*) while its release is being
#   finalized to request one snapshot run; on any other PR the job
#   skips and the label is NOT consumed. The label is deliberately
#   separate from the web `visual-check` label so the two budgets
#   are requested independently. It is one-shot: the job removes
#   it as soon as a run actually starts. Two gates run before the
#   label is consumed, and a gate skip KEEPS the label, so a later
#   push (synchronize) retries automatically:
#     1. CI-green gate: the `ci` check for the PR's exact head SHA
#        must have concluded success (bounded ~5 min wait).
#     2. Pixel gate: PRs whose diff touches only files that cannot
#        change pixels (markdown, docs/, .github/, changesets,
#        LICENSE, .gitignore, package manifests) skip. Exception:
#        the release PR is exempt — its diff is only release
#        metadata, so it would always skip, but its labeled run is
#        the release's visual check under the finalization model.
#   Exception (#53, same as web): a run triggered by dependabot[bot]
#   gets a read-only token, so it cannot consume the label; it
#   publishes with a warning instead.
# - Manual runs: workflow_dispatch runs on any branch on demand —
#   the escape hatch for re-seeding baselines or checking a
#   specific branch outside a release.
#
# Setup (one-time): a Chromatic React Native project for this repo,
# with its token stored as the CHROMATIC_RN_PROJECT_TOKEN repository
# secret (added by Stephen, verified 2026-11-05). Baseline seeding
# ran just after the ~2026-11-09 billing-cycle reset; Stephen
# accepts the seeded baselines himself.
#
# Build/publish split (#302 seeding fix): the run is TWO jobs, per
# Chromatic's current React Native CI docs. The first job builds the
# Storybook .apk itself with the CLI's `react-native-build`
# sub-command (Expo: `expo prebuild` + gradle `assembleRelease` for
# x86_64, with the STORYBOOK_*/EXPO_PUBLIC_ websocket variables the
# Storybook.tsx wiring consumes set by the CLI); the second job
# publishes the prebuilt artifact directory with
# `chromatic --storybook-build-dir`. The original single-step form
# (`npx chromatic` alone) failed at introduction on EVERY run at "Collecting
# Storybook metadata" with "Build script not found — the CLI didn't
# find a script called \"build-storybook\"": that check is the CLI's
# WEB Storybook path, and the CLI only skips it when its best-effort
# post-auth check reports the project as a React Native app or when
# a prebuilt storybook build directory is supplied. There is no
# build-storybook script for an on-device Storybook (and adding a
# fake one would send the CLI down the web build path), and no
# chromatic.config.json key makes the CLI treat a project as React
# Native — the reactNative.*BuildCommand keys are a non-Expo escape
# hatch only. The prebuilt-artifact flow is the documented Expo CI
# shape and skips the web build path; its one remaining Core touch is
# manifest generation, which loads .rnstorybook/main.ts via Core's
# loadStorybook and therefore requires the config's `framework`
# field ('@storybook/react-native') — added after main run
# 42956366058 (build 2) failed there with
# MissingFrameworkFieldError once the Chromatic project was
# correctly flagged as a React Native app.

on:
  # No push trigger: main pushes never run Chromatic RN (Stephen's
  # directive, 2026-11-12 — the same model as chromatic.yml). PR runs
  # are label-gated below and restricted to the release PR.
  pull_request:
    # `labeled` makes the visual-check-rn request work; the other types
    # let an already-labeled PR retry the gates when new commits land.
    types: [opened, reopened, synchronize, labeled]
  # Manual path: run the workflow on any branch on demand.
  workflow_dispatch:

# NOTE: concurrency lives on the job (below), not here — same
# reasoning as chromatic.yml: workflow-level concurrency would let
# events the job's own `if` skips cancel a deliberately requested
# run mid-flight.

jobs:
  chromatic-rn:
    name: Build RN Storybook artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # Empty on workflow_dispatch events (the gate step only runs
      # for PRs) — the publish job treats anything but "false" as
      # "run".
      run: ${{ steps.pr-gate.outputs.run }}
    concurrency:
      group: chromatic-rn-${{ github.event.pull_request.number || github.ref }}
      # Cancel superseded PR runs only: a dispatch run snapshots the
      # full suite, so a second dispatch on the same ref must queue
      # behind it rather than cancelling it mid-capture and wasting
      # the shared snapshot budget.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    # Fork PRs never receive repository secrets — skip them.
    # PR runs additionally require the visual-check-rn label AND a
    # release head branch (changeset-release/*): under the
    # finalization model the only labeled PR run is the Version
    # Packages PR's; any other PR skips here, before the label can
    # be consumed. A `labeled` event for any other label must not
    # start a run. Manual workflow_dispatch runs are admitted
    # outright.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'changeset-release/') &&
       contains(github.event.pull_request.labels.*.name, 'visual-check-rn') &&
       (github.event.action != 'labeled' || github.event.label.name == 'visual-check-rn'))
    steps:
      - name: Gate PR snapshot runs (pixel diff + CI green)
        id: pr-gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Default when anything is undetermined: run (conservative).
          echo "run=true" >> "$GITHUB_OUTPUT"

          # --- Pixel gate ------------------------------------------------
          # Skip when every changed file is one that cannot change
          # pixels. An empty or failed diff lookup means "unknown" and
          # falls through to run. The release PR (head branch
          # changeset-release/* — the only PR the job condition above
          # admits) is exempt: its diff is only release metadata, so
          # this gate would always skip it, but under the finalization
          # model its labeled run snapshots the release's accumulated
          # visual delta, so it must proceed to the CI-green gate
          # below. (Same exemption as chromatic.yml.)
          head_ref="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")"
          if [[ "$head_ref" != changeset-release/* ]] && files="$(gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" --name-only 2>/dev/null)" && [ -n "$files" ]; then
            visual=0
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              base="$(basename "$file")"
              case "$file" in
                *.md | docs/* | .github/* | .changeset/*) ;;
                *)
                  case "$base" in
                    LICENSE* | .gitignore | package.json | package-lock.json) ;;
                    *) visual=1 ;;
                  esac
                  ;;
              esac
            done <<< "$files"
            if [ "$visual" -eq 0 ]; then
              echo "::notice::Skipping Chromatic RN for PR #${PR_NUMBER}: no changed file can change pixels. The visual-check-rn label is kept; a later push re-checks the gates."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # --- CI-green gate ---------------------------------------------
          ci_state="missing"
          for attempt in $(seq 1 16); do
            ci_state="$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "ci" and .app.slug == "github-actions")] | sort_by(.started_at) | last | if . == null then "missing" else "\(.status):\(.conclusion)" end' \
              2>/dev/null || echo "unknown")"
            case "$ci_state" in
              completed:*) break ;;
              *)
                if [ "$attempt" -lt 16 ]; then
                  echo "ci check for ${HEAD_SHA} is '${ci_state}'; waiting 20s for it to finish (attempt ${attempt}/16)..."
                  sleep 20
                fi
                ;;
            esac
          done
          if [ "$ci_state" != "completed:success" ]; then
            echo "::notice::Skipping Chromatic RN for PR #${PR_NUMBER}: ci check for ${HEAD_SHA} is '${ci_state}', not completed:success. The visual-check-rn label is kept; a later push re-checks the gates."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Gates passed: snapshotting PR #${PR_NUMBER} at ${HEAD_SHA}."

      - name: Warn that a Dependabot-triggered run cannot consume the label
        if: github.event_name == 'pull_request' && steps.pr-gate.outputs.run == 'true' && github.actor == 'dependabot[bot]'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "::warning::This run was triggered by dependabot[bot], whose token is read-only: the visual-check-rn label on PR #${PR_NUMBER} cannot be removed by this run and must be removed manually. Publication proceeds."

      - name: Consume the visual-check-rn label (one-shot)
        if: github.event_name == 'pull_request' && steps.pr-gate.outputs.run == 'true' && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          output="$(gh api --method DELETE "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/visual-check-rn" 2>&1)" && delete_rc=0 || delete_rc=$?
          if [ "$delete_rc" -eq 0 ]; then
            echo "Removed the visual-check-rn label from PR #${PR_NUMBER}: the one-shot request is consumed."
          elif grep -Eq '"status": *"404"' <<< "$output"; then
            echo "::notice::visual-check-rn was already absent on PR #${PR_NUMBER} (consumed by a concurrent run); continuing to publish."
          else
            echo "$output" >&2
            exit 1
          fi

      - name: Checkout
        if: steps.pr-gate.outputs.run != 'false'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        if: steps.pr-gate.outputs.run != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # This job installs the HOST APP's lockfile (the root
          # install happens in the publish job).
          cache-dependency-path: apps/storybook/package-lock.json
          # GitHub Packages auth for @spudly/* deps — same setup
          # as ci.yml.
          registry-url: https://npm.pkg.github.com
          scope: "@spudly"

      - name: Enable Corepack (pinned npm)
        if: steps.pr-gate.outputs.run != 'false'
        run: corepack enable npm

      - name: Setup Java (gradle build)
        if: steps.pr-gate.outputs.run != 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Gradle caching — same setup as android-storybook.yml: the
      # android/ project is regenerated by `expo prebuild` each run,
      # so the task-output cache is what saves the compile work.
      - name: Setup Gradle
        if: steps.pr-gate.outputs.run != 'false'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Install host app dependencies
        if: steps.pr-gate.outputs.run != 'false'
        working-directory: apps/storybook
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Build RN Storybook artifact
        if: steps.pr-gate.outputs.run != 'false'
        working-directory: apps/storybook
        env:
          GRADLE_OPTS: -Dorg.gradle.caching=true
        run: |
          # Chromatic's documented Expo CI build step: builds the
          # Storybook .apk itself (expo prebuild + gradle
          # assembleRelease, x86_64 — the Chromatic emulator arch)
          # and writes it to build/storybook.apk, with the
          # STORYBOOK_*/EXPO_PUBLIC_ websocket variables set. The
          # app is Android-only (app.json platforms), so only the
          # android artifact is built.
          npx --yes chromatic react-native-build --platform=android --output-dir=build

      - name: Upload RN Storybook artifact
        if: steps.pr-gate.outputs.run != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: rn-storybook-build
          path: apps/storybook/build/
          retention-days: 1

  publish-chromatic-rn:
    name: Publish RN Storybook to Chromatic
    needs: chromatic-rn
    if: needs.chromatic-rn.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # GitHub Packages auth for @spudly/* deps in the root
          # lockfile (@spudly/eslint-config) — same setup as ci.yml.
          registry-url: https://npm.pkg.github.com
          scope: "@spudly"

      - name: Enable Corepack (pinned npm)
        run: corepack enable npm

      # Root install only (no workspaces): the root devDependencies
      # carry @storybook/react-native (pinned to the same 10.6.2 as
      # apps/storybook) so Storybook Core can resolve the framework's
      # preset from here during manifest generation — the RN config
      # itself lives in apps/storybook, whose dependencies this job
      # does not install.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Download RN Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: rn-storybook-build
          path: apps/storybook/storybook-static

      - name: Publish RN Storybook to Chromatic
        working-directory: apps/storybook
        env:
          CHROMATIC_RN_PROJECT_TOKEN: ${{ secrets.CHROMATIC_RN_PROJECT_TOKEN }}
        run: |
          # Prebuilt-artifact publish (Chromatic's React Native CI
          # docs): --storybook-build-dir points the CLI at the
          # artifact built by the previous job, so it generates the
          # story manifest from .rnstorybook and uploads the .apk
          # WITHOUT the web Storybook build path — the path that
          # failed every early run with "Build script not found"
          # (see the header note). Manifest generation does load
          # .rnstorybook/main.ts through Storybook Core, which is
          # why that config carries a `framework` field. The CLI
          # reads chromatic.config.json in this directory.
          npx --yes chromatic --project-token "$CHROMATIC_RN_PROJECT_TOKEN" --ci --exit-zero-on-changes --storybook-build-dir storybook-static
