name: merge-guard

# The PR template's pre-merge checklist gate, in its own workflow
# (split out of ci.yml on 2026-11-04). Ticking a checkbox in a PR body
# fires an `edited` event; while merge-guard lived in ci.yml, that
# event had to trigger the whole CI workflow, so every body edit
# re-ran the full build just to re-check the body. As its own
# workflow, a body edit re-runs only this ~5-second check, and a push
# runs the build exactly once. The check context stays "merge-guard";
# branch protection requires it directly, since ci-gate no longer
# needs it.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # The PR template's pre-merge checklist is only useful if something
  # enforces it: this job fails while the PR body still contains
  # unchecked task-list items. An item struck through with ~~ counts
  # as waived, per the template's own convention, and items inside
  # fenced code blocks or HTML comments don't count. Self-referential
  # items — ones whose truth depends on this workflow's own result —
  # are exempt (see the scan below). Dependabot is exempt — its bodies
  # quote upstream changelogs that can contain task lists the PR
  # author didn't write.
  merge-guard:
    name: merge-guard
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
      - name: Reject unchecked task-list items
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.env.PR_BODY_FILE, 'utf8');
          // Drop fenced code blocks (``` and ~~~): examples quoted in
          // the body are not live checklist items.
          const kept = [];
          let fence = null;
          for (const line of raw.split('\n')) {
            const marker = line.match(/^\s*(```|~~~)/);
            if (marker) {
              if (fence === null) {
                fence = marker[1];
              } else if (marker[1] === fence) {
                fence = null;
              }
              continue;
            }
            if (fence === null) {
              kept.push(line);
            }
          }
          // Drop HTML comments: the template's guidance lives there.
          const text = kept.join('\n').replace(/<!--[\s\S]*?-->/g, '');
          // Self-referential items are exempt: "CI is green for the
          // exact head commit" asserts the result of the very workflow
          // this job belongs to (ci-gate needs merge-guard), so the box
          // can only be honestly checked once the gate has already
          // passed, and the gate could never pass while the box was
          // enforced — every intermediate head failed on it. Keep the
          // pattern in sync with .github/pull_request_template.md;
          // every other checklist item stays enforced.
          const selfReferential = [/^ci is green for the exact head commit\b/i];
          const itemText = (line) => line.replace(/^[-*+]\s+\[\s\]\s+/, '');
          const candidates = text
            .split('\n')
            .map((line) => line.trim())
            .filter(
              (line) => /^\s*[-*+]\s+\[\s\]\s+\S/.test(line) && !line.includes('~~'),
            );
          const exempt = candidates.filter((line) =>
            selfReferential.some((pattern) => pattern.test(itemText(line))),
          );
          for (const line of exempt) {
            console.log(`Exempt (self-referential): ${line}`);
          }
          const unchecked = candidates.filter((line) => !exempt.includes(line));
          if (unchecked.length > 0) {
            console.error('Unchecked task-list items in the PR body:');
            for (const line of unchecked) {
              console.error(`  ${line}`);
            }
            console.error(
              'Check each item off, or strike it through with a one-line reason, before merging.',
            );
            process.exit(1);
          }
          console.log('All task-list items in the PR body are checked or waived.');
          NODE
